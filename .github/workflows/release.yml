name: Release YouPlayer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag Git existant a publier
        required: true
        type: string
      registry_prefix:
        description: 'Publication volontaire par couches : registre/espace/youplayer (vide = archive historique)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: youplayer-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verifier le mecanisme de mise a jour
        run: node --test --test-isolation=none test/server/update-control.test.js test/server/update-channel.test.js test/server/update-service.test.js test/server/production-tools.test.js test/account-view.test.js test/spotify-explorer.test.js
      - name: Preparer Podman
        shell: bash
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
      - name: Construire et signer les images
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_SIGNING_KEY: ${{ secrets.YOUPLAYER_RELEASE_SIGNING_KEY }}
          REGISTRY_PREFIX: ${{ inputs.registry_prefix }}
          REGISTRY_USERNAME: ${{ secrets.YOUPLAYER_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.YOUPLAYER_REGISTRY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY"
          command -v podman
          keyfile=$(mktemp)
          chmod 600 "$keyfile"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$RELEASE_SIGNING_KEY" > "$keyfile"
          options=()
          if [ -n "$REGISTRY_PREFIX" ]; then
            node --input-type=module -e 'import {validateImageRepository} from "./scripts/update-channel.mjs"; for (const service of ["backend", "frontend"]) validateImageRepository(`${process.env.REGISTRY_PREFIX}-${service}`);'
            test -n "$REGISTRY_USERNAME"
            test -n "$REGISTRY_PASSWORD"
            export REGISTRY_AUTH_FILE="$RUNNER_TEMP/youplayer-registry-auth.json"
            trap 'rm -f "$keyfile" "$REGISTRY_AUTH_FILE"' EXIT
            printf '%s' "$REGISTRY_PASSWORD" | podman login --tls-verify=true --username "$REGISTRY_USERNAME" --password-stdin "${REGISTRY_PREFIX%%/*}"
            options=(--registry-prefix "$REGISTRY_PREFIX")
          fi
          node scripts/build-update-release.mjs "$RELEASE_TAG" "$keyfile" "${options[@]}"
      - name: Attacher les images a la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REGISTRY_PREFIX: ${{ inputs.registry_prefix }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="releases/$RELEASE_TAG/update-assets/youplayer-update.json"
          assets=("$manifest")
          if [ -z "$REGISTRY_PREFIX" ]; then
            assets+=("releases/$RELEASE_TAG/update-assets/youplayer-images.tar")
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
