resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;

upstream youplayer_backend {
    zone youplayer_backend 64k;
    server backend:3000 resolve;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/youplayer.crt;
    ssl_certificate_key /etc/nginx/certs/youplayer.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;

    location = /health/live {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://youplayer_backend;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 4s;
    }

    location ^~ /audio/ {
        proxy_pass http://youplayer_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 2h;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /play/ {
        proxy_pass http://youplayer_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 2h;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /downloads/youplayer-spotify-bridge.xpi {
        default_type application/x-xpinstall;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~ ^/(auth|admin|spotify_test|spotify_login_sandbox_api|spotify_add_song|spotify_import_playlist|spotify_import_browser_playlist|youtube_import_playlist|run-script|update_playlist|delete_from_playlist|playlist_used|delete_playlist|liked_tracks|random|play_status|playlist(?:_preview|_preferences|_summaries)?|playback_state|different_playlist|next_song|previous_song|prefetched_next|add_song_ecoute|upload_to_playlist|send_search_youtube)(/|$) {
        proxy_pass http://youplayer_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 190s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(html|js|css)$ {
        try_files $uri =404;
    }

    location ~ ^/(server|playlists|local_song|musiq)(/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
